<text x="440" y="1366" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#53657C">按练习结果判断，再继续学习</text>
<polyline points="440,1190 440,1282" fill="none" stroke="#647A91" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
