<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1390" viewBox="0 0 1100 1390" role="img">
<title>每一讲：从跟做到独立完成</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#647A91"/></marker></defs>
<rect width="1100" height="1390" fill="#F8FAFD"/>
<text x="550.0" y="62" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="43" fill="#24344B">每一讲：从跟做到独立完成</text>
<text x="550.0" y="118" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#53657C">先预测，再运行；改一个输入，并解释变化</text>
<rect x="100.0" y="175.0" width="650" height="130" rx="18" fill="#EDF3FF" stroke="#A9BEE5" stroke-width="3"/>
<text x="425" y="217" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#24344B">读目标与前置，预测最小例子</text>
<text x="425" y="266" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#53657C">知道本讲解决什么问题</text>
<rect x="100.0" y="375.0" width="650" height="130" rx="18" fill="#EDF3FF" stroke="#A9BEE5" stroke-width="3"/>
<text x="425" y="417" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#24344B">在 VS Code 跟做并运行</text>
<text x="425" y="466" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#53657C">核对结果，按常见错误排查</text>
<rect x="100.0" y="575.0" width="650" height="130" rx="18" fill="#EDF3FF" stroke="#A9BEE5" stroke-width="3"/>
<text x="425" y="617" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#24344B">合上答案独立练习</text>
<text x="425" y="666" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#53657C">改一个输入，解释为什么变化</text>
<polyline points="425,305 425,375" fill="none" stroke="#647A91" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="425,505 425,575" fill="none" stroke="#647A91" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="425,705 425,850" fill="none" stroke="#647A91" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polygon points="425,850 680,940 425,1030 170,940" fill="#FFF5DE" stroke="#CAA45A" stroke-width="3"/>
<text x="425" y="918.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="28" fill="#24344B">达到本讲的</text>
<text x="425" y="961.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="28" fill="#24344B">完成标准了吗？</text>
<rect x="795.0" y="875.0" width="270" height="130" rx="18" fill="#FFF8E9" stroke="#DCC18C" stroke-width="3"/>
<text x="930" y="917" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#24344B">找出一处卡点</text>
<text x="930" y="966" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#53657C">回看解释后重做</text>
<polyline points="680,940 795,940" fill="none" stroke="#647A91" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="738" y="900" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#53657C">还没有</text>
<polyline points="930,875 930,640 750,640" fill="none" stroke="#647A91" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="100.0" y="1137.5" width="650" height="125" rx="18" fill="#E8F5EF" stroke="#9AC8B2" stroke-width="3"/>
<text x="425" y="1177" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#24344B">记录实际程度与问题</text>
<text x="425" y="1226" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#53657C">按页末下一步继续</text>
<polyline points="425,1030 425,1137" fill="none" stroke="#647A91" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="345" y="1080" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#53657C">已达到</text>
<text x="550" y="1330" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#53657C">跟做、独立、迁移分别记录；按本讲标准决定是否勾选</text>
</svg>